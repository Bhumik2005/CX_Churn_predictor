version: '3.8'

services:
  backend:
    build: .
    container_name: asio_churn_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn src.backend_api:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build: .
    container_name: asio_churn_dashboard
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run dashboard.py --server.address=0.0.0.0
    depends_on:
      - backend